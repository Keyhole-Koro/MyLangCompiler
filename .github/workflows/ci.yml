name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: toolchain/MyLangCompiler

    steps:
      - name: Checkout MyLangCompiler
        uses: actions/checkout@v4
        with:
          path: toolchain/MyLangCompiler

      - name: Checkout MySyntaxEngine
        uses: actions/checkout@v4
        with:
          repository: Keyhole-Koro/MySyntaxEngine
          path: toolchain/MySyntaxEngine

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Run compiler component tests
        run: make test-component
