name: CI Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: toolchain/MyLangCompiler

    steps:
      - name: Checkout MyLangCompiler
        uses: actions/checkout@v4
        with:
          path: toolchain/MyLangCompiler

      - name: Checkout MySyntaxEngine
        uses: actions/checkout@v4
        with:
          repository: Keyhole-Koro/MySyntaxEngine
          path: toolchain/MySyntaxEngine

      - name: Checkout MyLangTester
        uses: actions/checkout@v4
        with:
          repository: Keyhole-Koro/MyLangTester
          path: toolchain/MyLangTester

      - name: Set up Make
        run: sudo apt-get update && sudo apt-get install -y make

      - name: Run tests
        run: make test